<!DOCTYPE html>
<html>
<head>
    <title>Issued Books</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        /* Decorative background */

        body::before{
            content:"";
            position:fixed;
            width:350px;
            height:350px;
            background:#eee4c3;
            border-radius:50%;
            top:-120px;
            left:-120px;
            z-index:-1;
        }

        body::after{
            content:"";
            position:fixed;
            width:320px;
            height:320px;
            background:#d4e0f0;
            border-radius:50%;
            right:-100px;
            bottom:-100px; 
            z-index:-1;
        }

        h1{
            text-align: center;
            color: white;
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            margin-top:5px;  
            margin-bottom: 30px;
        }

        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .card{
            background:#fff;
            width:270px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-5px);
        }

        .book-img{
          width: 100%;
          height: 300px;
          object-fit:cover;
          object-position: center;
          background:#fff;
          display:block;
        }

        .card-content{
            padding:12px 18px;
        }

        .student-name{
            color: #2c3e50;
            margin-bottom:8px;
            border-bottom: 2px solid #3498db;
            padding-bottom:6px;
        }

        .info{
            margin:6px 0;
            font-size:15px;
        }

        .label{
            font-weight: bold;
            color: #3498db;
        }

        .empty{
            text-align: center;
            font-size: 20px;
            color: red;
        }
    </style>
</head>

<body>

    <h1>📚 Issued Books</h1>

    <div class="container">

        {% for b in books %}
        <div class="card">

            {% if b.book_image %}
                <img src="{{ b.book_image.url }}" alt="Book Image" class="book-img">
            {% endif %}

            <div class="card-content">

                <h2 class="student-name">
                    {{ b.stud_name }}
                </h2>

                <p class="info">
                    <span class="label">Book:</span>
                    {{ b.book_name.book_name }}
                </p>

                <p class="info">
                    <span class="label">Issue Date:</span>
                    {{ b.issue_date }}
                </p>

                <p class="info">
                    <span class="label">Return Date:</span>
                    {{ b.return_date }}
                </p>

            </div>

        </div>

        {% empty %}
            <p class="empty">No issued books found.</p>
        {% endfor %}

    </div>

</body>
</html>
