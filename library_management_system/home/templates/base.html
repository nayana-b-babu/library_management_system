<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Management System{% endblock %}</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav{
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover{
            color: #f1c40f;
        }

        .content{
            padding: 20px;
            min-height: 500px;
        }

        footer{
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    {% if user.is_authenticated %}
    <form method = 'POST' action = "{% url 'logout' %}">
    {% csrf_token %}
    <button type = 'submit'>Logout</button>
    </form>
    {% else %}
    <a href = "{% url 'login' %}">Login</a>
    {% endif %}
    
    <nav>
        <a href="/books/">Books</a>
        <a href="/purchasebook/">Add Book</a>
        <a href="/issuebook/">Issue Book</a>
        <a href="/returnbook/">Return Book</a>
    </nav>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>© 2026 Library Management System</p>
    </footer>

</body>
</html>
